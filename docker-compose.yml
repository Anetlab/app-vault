# version: '3.8'

services:
  # PostgreSQL Database (Optional - disable if using external DB)
  # To use with postgres: docker-compose --profile with-postgres up
  # To use external DB: docker-compose up (skips postgres)
  postgres:
    image: postgres:15-alpine
    container_name: appvault-postgres
    profiles:
      - with-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-appvault}
    # No ports exposed - only accessible inside docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - appvault-network

  # App Vault API Server
  appvault:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: appvault-server
    env_file:
      - .env
    environment:
      # Database connection - configure these for external DB
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-appvault}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
    ports:
      - "${SERVER_PORT:-8888}:8888"
      - "${TLS_PORT:-8443}:8443"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped
    networks:
      - appvault-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Vue 3 Web Frontend
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: appvault-web
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    depends_on:
      - appvault
    restart: unless-stopped
    networks:
      - appvault-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  appvault-network:
    driver: bridge

volumes:
  postgres_data:
